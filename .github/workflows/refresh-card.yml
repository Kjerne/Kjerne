name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both themes
        env:
          HANDLE: Kjerne
          IMAGE: https://raw.githubusercontent.com/Kjerne/Kjerne/main/avatar.png
          COLS: "100"
        run: |
          for theme in dark light; do
            curl -fsSL --retry 3 --retry-delay 5 -G "https://gh.crafter.run/$HANDLE" \
              --data-urlencode "theme=$theme" \
              --data-urlencode "cols=$COLS" \
              --data-urlencode "image=$IMAGE" \
              -o "$theme.tmp"
            grep -q "<svg" "$theme.tmp"
            mv "$theme.tmp" "${theme}_mode.svg"
          done

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged, nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi
